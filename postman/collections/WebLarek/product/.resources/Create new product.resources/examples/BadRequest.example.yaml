$kind: http-example
request:
  url: "{{baseUrl}}/product"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: "{\r

      \    \"description\": \"Откройте эти куки, чтобы узнать, какой фреймворк вы должны изучить дальше.\",\r

      \    \"image\": \"/images/Soft_Flower.png\",\r

      \    \"category\": \"дополнительное\",\r

      \    \"price\": 2500\r

      }"
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: "{\r

      \    \"statusCode\": 400,\r

      \    \"error\": \"Bad Request\",\r

      \    \"message\": \"Validation failed\",\r

      \    \"validation\": {\r

      \        \"body\": {\r

      \            \"source\": \"body\",\r

      \            \"keys\": [\r

      \                \"title\"\r

      \            ],\r

      \            \"message\": \"\\\"title\\\" is required\"\r

      \        }\r

      \    }\r

      }"
order: 2000
