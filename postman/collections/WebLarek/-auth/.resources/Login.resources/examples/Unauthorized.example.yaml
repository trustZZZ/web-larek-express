$kind: http-example
request:
  url: "{{baseUrl}}/auth/login"
  method: POST
  body:
    type: json
    content: "{\r

      \    \"email\": \"admin@gmail.com\",\r

      \    \"password\": \"123456789\"\r

      }"
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: "{\r

      \    \"message\": \"Неправильные почта или пароль\"\r

      }"
order: 2000
