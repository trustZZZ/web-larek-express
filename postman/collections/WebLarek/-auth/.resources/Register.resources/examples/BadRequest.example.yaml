$kind: http-example
request:
  url: "{{baseUrl}}/auth/register"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: "{\r

      \    \"name\": \"Василий\",\r

      \    \"email\": \"admin@gmail.com\",\r

      \    \"password\": \"123456789\"\r

      }"
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: "{\r

      \    \"message\": \"user validation failed: email: Поле \\\"email\\\" должно быть заполнено\"\r

      }"
order: 3000
