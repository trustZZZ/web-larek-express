$kind: http-example
request:
  url: "{{baseUrl}}/product"
  method: POST
  headers:
    Authorization: "{{accessToken}}"
  body:
    type: formdata
    content:
      - type: text
        key: description
        value: Чтобы научиться правильно называть модификаторы, без этого не обойтись.
      - type: text
        key: title
        value: БЭМ-пилюлька
        disabled: true
      - type: text
        key: category
        value: другое
      - type: text
        key: price
        value: "1500"
response:
  statusCode: 200
  statusText: OK
  headers:
    X-Powered-By: Express
    Access-Control-Allow-Origin: "*"
    Content-Type: application/json; charset=utf-8
    Content-Length: "262"
    ETag: W/"106-tQhoH+yYIBbNE2UOGvU1poblMkY"
    Date: Thu, 11 Jan 2024 19:45:58 GMT
    Connection: keep-alive
    Keep-Alive: timeout=5
  body:
    type: json
    content: |-
      {
          "fileName": "/images/5_Dots.png",
          "originalName": "5_Dots.png"
      }
order: 1000
